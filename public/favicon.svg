<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4" />
  <!-- AI / Neural nodes and edges -->
  <circle cx="20" cy="22" r="3" fill="#14b8a6" />
  <circle cx="44" cy="22" r="3" fill="#06b6d4" />
  <circle cx="32" cy="42" r="3.5" fill="#2dd4bf" filter="url(#glow)" />
  <line x1="20" y1="22" x2="32" y2="42" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="44" y1="22" x2="32" y2="42" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="20" y1="22" x2="44" y2="22" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.5" />
  <!-- Letter P monogram in center -->
  <text x="32" y="36" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">P</text>
</svg>
